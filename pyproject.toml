[project]
name = "verified-sched-ext"
version = "0.1.0"
description = "Formally verified sched_ext scheduler via multi-agent pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",           # LLM client for agents
    "pydantic>=2.0",               # Structured data for agent messages
    "rich>=13.0",                  # CLI output formatting
    "click>=8.0",                  # CLI argument parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",             # Property-based testing
    "syzkaller-python>=0.1",       # Fuzzing integration (if available)
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "trace: trace-driven consistency tests",
    "fuzz: fuzz tests (slow)",
    "perf: performance benchmarks (requires BPF module loaded)",
]
